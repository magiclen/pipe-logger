[package]
name = "pipe-logger"
version = "2.0.1"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/magiclen/pipe-logger"
homepage = "https://magiclen.org/pipe-logger"
keywords = ["logger", "log", "pipe", "rotation", "logrotate"]
categories = ["command-line-utilities", "development-tools::debugging"]
description = "Stores, rotates, compresses process logs."
license = "MIT"
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
concat-with = "0.2"
terminal_size = "0.4"

anyhow = "1"

pipe-logger-lib = "2"

byte-unit = "5"
